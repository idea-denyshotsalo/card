<!doctype html>
<html lang="uk" data-lang="uk" data-title-uk="Цифрові візитки — $company" data-title-en="Digital business cards — $company">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифрові візитки — $company</title>
<meta name="description" content="$company — цифрові візитки команди.">
<meta name="theme-color" content="#e1dcd5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#00262d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="$favicon">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preload" href="assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<script>$lang_js</script>
<style>$font_css$css</style>
</head>
<body>
<main class="wrap">
<article class="pass">
<div class="pass-head">
$mark
<div class="pass-top">$logo<span class="pass-tag"><i></i><span data-l="uk">Візитки</span><span data-l="en">Business cards</span></span></div>
<h1 class="pass-name"><span><span data-l="uk">Цифрові візитки команди</span><span data-l="en">Team business cards</span></span></h1>
<p class="pass-role">$company</p>
</div>
<div class="pass-stub"><p><span data-l="uk">Відскануйте QR-код з візитки співробітника, щоб відкрити його контакти.</span><span data-l="en">Scan the QR code on an employee's card to open their contacts.</span></p></div>
</article>
<a class="save" href="$website" target="_blank" rel="noopener"><span data-l="uk">Сайт компанії</span><span data-l="en">Company website</span></a>
<footer class="foot">
<p class="foot-tag">$tagline</p>
<div class="lang" role="group" aria-label="Language"><button type="button" data-set-lang="uk">UA</button><button type="button" data-set-lang="en">EN</button></div>
</footer>
</main>
<script>$js</script>
</body>
</html>
